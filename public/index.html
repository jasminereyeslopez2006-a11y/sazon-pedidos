<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sazón — Menú del día</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="backdrop"></div>

<div class="phone">
  <div class="phone-notch"></div>

  <header class="app-header">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12c3-5 6-7 8-7s5 2 8 7c-3 5-6 7-8 7s-5-2-8-7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Sazón</span>
    </div>
    <a class="icon-btn" href="login.html" aria-label="Ingresar o registrarse">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8.5" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-4 4.4-6 7-6s5.8 2 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
  </header>

  <main class="app-body">
    <p class="saludo" id="saludo"></p>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10.5" cy="10.5" r="6.2" stroke="currentColor" stroke-width="1.6"/><path d="M19 19l-3.6-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar en el menú del día">
    </div>

    <div class="section-title">
      <h2>Menú del día</h2>
      <span class="tag" id="contadorPlatillos"></span>
    </div>

    <!-- Las tarjetas se dibujan desde js/app.js con los datos de la base de datos -->
    <div class="menu-grid" id="menuGrid">
      <p class="mensaje-vacio">Cargando menú...</p>
    </div>
  </main>

  <footer class="app-footer">
    <button class="btn btn-primary" type="button" id="botonPedido">Crear pedido / Ingresar</button>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
