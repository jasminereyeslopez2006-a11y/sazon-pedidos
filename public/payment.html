<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sazón — Método de pago</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="backdrop"></div>

<div class="phone">
  <div class="phone-notch"></div>

  <header class="app-header">
    <a class="icon-btn" href="checkout.html" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 5 7 12l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span class="brand-name">Método de pago</span>
    <span class="espacio-vacio"></span>
  </header>

  <main class="app-body">
    <div class="pay-option selected" data-method="tarjeta">
      <div class="pay-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="6" width="18" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10.5h18" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="pay-copy">
        <strong>Tarjeta de crédito o débito</strong>
        <span>Visa, Mastercard y más</span>
      </div>
      <div class="radio"></div>
    </div>

    <div class="pay-option" data-method="contra_entrega">
      <div class="pay-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="6.5" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M6 8.5v7M18 8.5v7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div class="pay-copy">
        <strong>Pago contra entrega</strong>
        <span>Paga en efectivo al recibir</span>
      </div>
      <div class="radio"></div>
    </div>

    <div class="card-form" id="cardForm">
      <div class="field">
        <label for="cardName">Nombre</label>
        <input type="text" id="cardName" placeholder="Como aparece en la tarjeta">
      </div>
      <div class="field">
        <label for="cardNumber">Número de tarjeta</label>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19">
      </div>
      <div class="field">
        <label for="cardCode">Código</label>
        <input type="text" id="cardCode" placeholder="CVC" inputmode="numeric" maxlength="4" style="max-width:120px;">
      </div>
    </div>

    <p class="mensaje-error" id="mensajeError"></p>
  </main>

  <footer class="app-footer">
    <div class="btn-row">
      <a class="btn btn-ghost" href="checkout.html">Regresar</a>
      <button class="btn btn-primary" type="button" id="confirmPayment">Confirmar pedido</button>
    </div>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
